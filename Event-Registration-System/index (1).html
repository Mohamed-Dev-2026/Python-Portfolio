<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Registration System</title>
  <!-- Served by Flask's url_for so the path is always correct -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════
       HEADER
  ═══════════════════════════════════════════════ -->
  <header class="header">
    <div class="header-inner">
      <div class="header-brand">
        <span class="icon">🎟️</span>
        Event Registration System
      </div>
      <button class="btn btn-outline" style="color:#fff;border-color:rgba(255,255,255,.5);"
              onclick="openCreateModal()">
        + New Event
      </button>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════════
       MAIN CONTENT
  ═══════════════════════════════════════════════ -->
  <main class="main">
    <div class="section-header">
      <div>
        <h2 class="section-title">Upcoming Events</h2>
        <p class="section-subtitle">Click <strong>Register</strong> on any card to sign up.</p>
      </div>
      <button class="btn btn-primary" onclick="openCreateModal()">+ Create Event</button>
    </div>

    <!-- Event cards are injected here by app.js -->
    <div class="events-grid" id="eventsGrid"></div>
  </main>

  <!-- ═══════════════════════════════════════════════
       MODAL: Create Event
  ═══════════════════════════════════════════════ -->
  <div class="modal-overlay" id="createOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="createModalTitle">
      <div class="modal-header">
        <span class="modal-title" id="createModalTitle">✨ Create New Event</span>
        <button class="modal-close" onclick="closeCreateModal()" aria-label="Close">&times;</button>
      </div>

      <form id="createForm" onsubmit="submitCreateEvent(event)" novalidate>
        <div class="modal-body">
          <div class="form-group">
            <label for="eventName">Event Name *</label>
            <input type="text" id="eventName" placeholder="e.g. Python Workshop" required />
          </div>
          <div class="form-group">
            <label for="eventDate">Date & Time *</label>
            <input type="datetime-local" id="eventDate" required />
          </div>
          <div class="form-group">
            <label for="eventDesc">Description</label>
            <textarea id="eventDesc" placeholder="What is this event about? (optional)"></textarea>
          </div>
          <p class="field-hint" id="createError" style="color:var(--danger);font-weight:600;min-height:1.2em;"></p>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeCreateModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="createSubmitBtn">Create Event</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════
       MODAL: Register for Event
  ═══════════════════════════════════════════════ -->
  <div class="modal-overlay" id="registerOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="registerModalTitle">
      <div class="modal-header">
        <div>
          <span class="modal-title" id="registerModalTitle">✏️ Register</span>
          <p style="font-size:.82rem;color:var(--gray-400);margin-top:.2rem;" id="registerEventName"></p>
        </div>
        <button class="modal-close" onclick="closeRegisterModal()" aria-label="Close">&times;</button>
      </div>

      <form id="registerForm" onsubmit="submitRegister(event)" novalidate>
        <div class="modal-body">
          <div class="form-group">
            <label for="userName">Full Name *</label>
            <input type="text" id="userName" placeholder="Alice Smith" required />
          </div>
          <div class="form-group">
            <label for="userEmail">Email Address *</label>
            <input type="email" id="userEmail" placeholder="alice@example.com" required />
          </div>
          <p class="field-hint" id="registerError" style="color:var(--danger);font-weight:600;min-height:1.2em;"></p>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeRegisterModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="registerSubmitBtn">Register</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════
       MODAL: View Attendees
  ═══════════════════════════════════════════════ -->
  <div class="modal-overlay" id="viewOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="viewModalTitle">
      <div class="modal-header">
        <div>
          <span class="modal-title" id="viewModalTitle">👥 Attendees</span>
          <p style="font-size:.82rem;color:var(--gray-400);margin-top:.2rem;">
            <span id="viewEventName"></span>
            &nbsp;·&nbsp;
            <span id="viewTotal"></span>
          </p>
        </div>
        <button class="modal-close" onclick="closeViewModal()" aria-label="Close">&times;</button>
      </div>

      <div class="modal-body" style="max-height:55vh;overflow-y:auto;">
        <ul class="reg-list" id="viewList"></ul>
      </div>

      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeViewModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════
       TOAST CONTAINER
  ═══════════════════════════════════════════════ -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
